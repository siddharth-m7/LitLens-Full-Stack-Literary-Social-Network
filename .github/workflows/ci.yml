name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Backend unit + integration tests ──────────────────────────────────
  backend-tests:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          FRONTEND_URL: http://localhost:5173
          # mongodb-memory-server handles MongoDB — no URI needed
          # ioredis-mock handles Redis — no URL needed

  # ── Job 2: Frontend RTL tests ─────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        # No env vars needed — MSW intercepts all API calls

  # ── Job 3: E2E tests (Playwright) ────────────────────────────────────────────
  # Runs only after both unit test jobs pass
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Seed E2E admin user
        run: node scripts/seedE2E.js
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/bookapp-e2e

      - name: Start backend server
        run: npm start &
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/bookapp-e2e
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          FRONTEND_URL: http://localhost:5173
          REDIS_URL: ""
          # Cloudinary — only needed for cover image uploads (not tested in E2E)
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on port 5000..."
          for i in {1..30}; do
            curl -sf http://localhost:5000/api/v1/ping && echo "Backend is up!" && break
            echo "Attempt $i/30 — retrying in 1s..."
            sleep 1
          done

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
